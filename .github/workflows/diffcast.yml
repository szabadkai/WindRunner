name: diffcast

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: szabadkai/prdemo@main
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
